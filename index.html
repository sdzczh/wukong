<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>无敌悟空 · 文字塔防</title>
<link rel="stylesheet" href="css/style.css?v=20261018d">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- 顶栏 -->
  <div id="hud-top">
    <button id="btn-pause" class="hud-btn" title="暂停">❚❚</button>
    <div class="pill"><span class="ico-peach"></span><span id="peach-num">0</span></div>
    <div id="wave-label" class="pill">备战中</div>
    <div class="pill pill-heart">♥<span id="heart-num">10</span></div>
    <button id="btn-fast" class="hud-btn" title="战斗加速">1×</button>
    <button id="btn-idle" class="hud-btn hidden" title="挂机托管：自动召唤/合成/摆位/叫波（挂机局不上榜）">挂</button>
    <button id="btn-dps" class="hud-btn" title="伤害榜：实时 DPS 排行">伤</button>
    <button id="btn-gear" class="hud-btn" title="装备栏：部件 ×3 合成装备，点装备再点塔佩戴">装</button>
    <button id="btn-sound" class="hud-btn" title="音效开关">♪</button>
  </div>

  <!-- 波次横幅 -->
  <div id="wave-banner" class="hidden"><div id="wave-banner-main"></div><div id="wave-banner-sub"></div></div>
  <div id="toast" class="hidden"></div>

  <!-- 实时 DPS 面板：顶栏「伤」开关 -->
  <div id="dps-panel" class="hidden"></div>

  <!-- 新手三步引导气泡：不拦截操作，完成/跳过后不再弹 -->
  <div id="tut-tip" class="hidden">
    <span id="tut-msg"></span>
    <button id="tut-skip">跳过</button>
  </div>

  <!-- 提前叫波：备战期显示，按剩余秒数奖桃 -->
  <button id="btn-callwave" class="hidden">提前叫波<span id="callwave-bonus"></span></button>

  <!-- 底栏：召唤架 + 召唤 + 铲子 -->
  <div id="hud-bottom">
    <div id="rack">
      <div class="slot empty"></div>
      <div class="slot empty"></div>
      <div class="slot empty"></div>
      <div class="slot empty"></div>
      <div class="slot empty"></div>
    </div>
    <button id="btn-summon">
      <span class="sum-label">召 唤</span>
      <span class="sum-cost">12 桃</span>
    </button>
    <button id="btn-shovel" class="tool-btn" title="铲子：短按开垦「封」字地块；无铲短按或长按花桃补铲">
      <span class="tchar">铲</span><span class="tname">×2</span><span class="tbuy">50 桃</span>
    </button>
  </div>

  <!-- 装备栏：顶栏「装」按钮开合；部件 ×3 合成装备；点装备再点塔佩戴；3 件同级再合成升级 -->
  <div id="gear-bar" class="hidden"></div>

  <!-- 召唤选牌：一次 5 张点选入架，未选的再次召唤时作废 -->
  <div id="draft-bar" class="hidden">
    <div class="draft-title">召唤结果 · 点选入架<span class="draft-tip">未选的卡，再次召唤时消失</span><button class="draft-refresh">刷新 3桃</button><button class="draft-x">放 弃</button></div>
    <div class="draft-cards"></div>
  </div>

  <!-- 波间命运三选一：每 3 波过波后弹出 -->
  <div id="mod-bar" class="hidden"></div>
  <!-- 无尽幽冥异象：无尽模式每逢 5 波过波后弹出二选一事件 -->
  <div id="event-bar" class="hidden"></div>

  <!-- 波间瑶池祝福：备战期花桃买临时增益（上排，避开右上角叫波按钮） -->
  <div id="bless-bar" class="hidden"></div>

  <!-- 羁绊条：底栏上方共享条带，全部羁绊进度芯片（灰暗=未激活/点亮=生效中），点芯片看详情 -->
  <div id="bond-bar" class="hidden"></div>

  <!-- 瑶池祝福购买确认 -->
  <div id="bless-confirm" class="hidden">
    <div class="bc-title">瑶 池 祝 福</div>
    <div class="bc-body"></div>
    <div class="bc-btns">
      <button id="bc-yes">买 下</button>
      <button id="bc-no" class="ghost">再 想 想</button>
    </div>
  </div>

  <!-- 选中单位面板 / 架子字卡面板（长按） / 拖拽幽灵 -->
  <div id="sel-panel" class="hidden"></div>
  <div id="item-panel" class="hidden"></div>
  <div id="drag-ghost" class="hidden"></div>

  <!-- 双击「封」字地块：开垦确认（消耗 1 把铲子） -->
  <div id="unlock-panel" class="hidden">
    <div class="ul-title">开 垦</div>
    <div class="ul-body">消耗 1 把铲子，开垦此「封」字地块？</div>
    <div class="ul-left">剩余铲子　<span id="ul-count">0</span> 把</div>
    <div class="ul-btns">
      <button id="ul-yes">开 垦</button>
      <button id="ul-no" class="ghost">取 消</button>
    </div>
  </div>

  <!-- 扣心红闪 -->
  <div id="dmg-flash"></div>

  <!-- 弹层 -->
  <div id="overlay">
    <div id="overlay-card">
      <h1 id="overlay-title">无敌悟空</h1>
      <p id="overlay-sub"></p>
      <div id="overlay-stats"></div>
      <div id="overlay-btns"></div>
    </div>
  </div>
</div>
