<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>无敌悟空 · 文字塔防</title>
<link rel="stylesheet" href="css/style.css?v=20261015c">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- 顶栏 -->
  <div id="hud-top">
    <button id="btn-pause" class="hud-btn" title="暂停">❚❚</button>
    <div class="pill"><span class="ico-peach"></span><span id="peach-num">0</span></div>
    <div id="wave-label" class="pill">备战中</div>
    <div class="pill pill-heart">♥<span id="heart-num">10</span></div>
    <button id="btn-fast" class="hud-btn" title="战斗加速">1×</button>
    <button id="btn-sound" class="hud-btn" title="音效开关">♪</button>
  </div>

  <!-- 波次横幅 -->
  <div id="wave-banner" class="hidden"><div id="wave-banner-main"></div><div id="wave-banner-sub"></div></div>
  <div id="toast" class="hidden"></div>

  <!-- 底栏：召唤架 + 召唤 + 铲子 -->
  <div id="hud-bottom">
    <div id="rack">
      <div class="slot empty"></div>
      <div class="slot empty"></div>
      <div class="slot empty"></div>
      <div class="slot empty"></div>
      <div class="slot empty"></div>
    </div>
    <button id="btn-summon">
      <span class="sum-label">召 唤</span>
      <span class="sum-cost">12 桃</span>
    </button>
    <button id="btn-shovel" class="tool-btn" title="铲子：开垦「封」字地块，或把单位铲回架子">
      <span class="tchar">铲</span><span class="tname">×2</span>
    </button>
  </div>

  <!-- 召唤选牌：一次 5 张点选入架，未选的再次召唤时作废 -->
  <div id="draft-bar" class="hidden">
    <div class="draft-title">召唤结果 · 点选入架<span class="draft-tip">未选的卡，再次召唤时消失</span><button class="draft-x">放 弃</button></div>
    <div class="draft-cards"></div>
  </div>

  <!-- 选中单位面板 / 拖拽幽灵 -->
  <div id="sel-panel" class="hidden"></div>
  <div id="drag-ghost" class="hidden"></div>

  <!-- 弹层 -->
  <div id="overlay">
    <div id="overlay-card">
      <h1 id="overlay-title">无敌悟空</h1>
      <p id="overlay-sub"></p>
      <div id="overlay-stats"></div>
      <div id="overlay-btns"></div>
    </div>
  </div>
</div>

<script src="js/config.js?v=20261015c"></script>
<script src="js/rng.js?v=20261015c"></script>
<script src="js/save.js?v=20261015c"></script>
<script src="js/user.js?v=20261015c"></script>
<script src="js/talents.js?v=20261015c"></script>
<script src="js/audio.js?v=20261015c"></script>
<script src="js/state.js?v=20261015c"></script>
<script src="js/grid.js?v=20261015c"></script>
<script src="js/ui/fx.js?v=20261015c"></script>
<script src="js/battle/enemy.js?v=20261015c"></script>
<script src="js/battle/projectile.js?v=20261015c"></script>
<script src="js/battle/tower.js?v=20261015c"></script>
<script src="js/battle/general.js?v=20261015c"></script>
<script src="js/battle/merge.js?v=20261015c"></script>
<script src="js/battle/skill.js?v=20261015c"></script>
<script src="js/battle/director.js?v=20261015c"></script>
<script src="js/ui/hud.js?v=20261015c"></script>
<script src="js/ui/rack.js?v=20261015c"></script>
<script src="js/ui/panels.js?v=20261015c"></script>
<script src="js/ui/codex.js?v=20261015c"></script>
<script src="js/ui/talent.js?v=20261015c"></script>
<script src="js/main.js?v=20261015c"></script>
</body>
</html>
